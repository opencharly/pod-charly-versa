charly-versa:
    candy:
        description: |-
            Metadata concept candy owning the charly-versa skills whose names have no namesake candy (versa geo/marimo images). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the versa concept candy's skill entities are present — each of the seven `*-skill:` entities this candy declares exists in charly.yml, and they are the seven the marketplace generates into `versa/skills` (the family's routed/unrouted split is asserted separately and by the dispatcher ratchet)
              id: charly-versa-present
              context:
                - build
              command: |
                f=charly.yml
                [ -f "$f" ] || f="$(git rev-parse --show-toplevel 2>/dev/null)/charly.yml"
                bad=0
                for e in airflow-layer-skill debug-tools-layer-skill maputnik-layer-skill marimo-layer-skill marimo-mcp-skill osm-tools-layer-skill sway-browser-ecovoyage-skill; do
                  grep -q "^${e}:$" "$f" || { echo "MISSING skill entity: $e"; bad=1; }
                done
                exit $bad
            - check: every `*-skill:` entity in this repo carries a `triggers:` key AND at least one trigger item under it — the marketplace dispatcher's generated rows come ONLY from `triggers:`-bearing skills, so a skill without one is invisible to R0 and reachable only from the hand-curated table
              id: skill-triggers-present
              context:
                - build
              command: |
                f=charly.yml
                [ -f "$f" ] || f="$(git rev-parse --show-toplevel 2>/dev/null)/charly.yml"
                awk '
                /^[a-z0-9-]+-skill:[[:space:]]*$/ {
                  if (name != "" && !(has_trig[name] && has_item[name])) {
                    print (has_trig[name] ? "EMPTY triggers: " : "MISSING triggers: ") name; bad = 1
                  }
                  name = $1; sub(/:$/, "", name); has_trig[name] = 0; has_item[name] = 0; in_trig = 0; next
                }
                name != "" && in_trig && /^[[:space:]]+-[[:space:]]/ { has_item[name] = 1; next }
                name != "" && /^[[:space:]]+triggers:[[:space:]]*$/ { has_trig[name] = 1; in_trig = 1; next }
                { if (in_trig) in_trig = 0 }
                END {
                  if (name != "" && !(has_trig[name] && has_item[name])) {
                    print (has_trig[name] ? "EMPTY triggers: " : "MISSING triggers: ") name; bad = 1
                  }
                  exit bad
                }
                ' "$f"

airflow-layer-skill:
    skill:
        name: airflow-layer
        family: versa
        owner: charly-versa
        triggers:
            - "the airflow layer / Apache Airflow 3.x (LocalExecutor + SQLite; supervisord init/scheduler/dag-processor/webserver services) — Airflow DAG authoring, the Airflow REST API, the SimpleAuthManager pattern, or the dag-processor split-from-scheduler architecture"
debug-tools-layer-skill:
    skill:
        name: debug-tools-layer
        family: versa
        owner: charly-versa
        triggers:
            - "the debug-tools layer / in-container service debugging — network probes (ip/ss/lsof/ping/dig/nc/socat/tcpdump/traceroute/mtr/wget), process inspection (ps/top/htop/pgrep/strace/free/vmstat), file inspection, or the per-distro package-name divergence (nmap-ncat vs ncat vs gnu-netcat)"
maputnik-layer-skill:
    skill:
        name: maputnik-layer
        family: versa
        owner: charly-versa
        triggers:
            - "the maputnik layer / the Maputnik visual editor for MapLibre GL vector-tile styles (npm-built SPA served as a static dist by python -m http.server; the Vite --base=/ build override; the asset-base lock-in check)"
marimo-layer-skill:
    skill:
        name: marimo-layer
        family: versa
        owner: charly-versa
        triggers:
            - "the marimo layer / the reactive notebook server + MCP runtime, its pixi environment (cudf-polars-cu13, polars, geopandas, quackosm, gtfs-parquet), the supervisord service spec, or the cell-display + mo.iframe rendering patterns"
marimo-mcp-skill:
    skill:
        name: marimo-mcp
        family: versa
        owner: charly-versa
        triggers:
            - "the marimo MCP server on port 2718 path /mcp/server (get_active_notebooks, get_cell_outputs, get_notebook_errors) — the marimo MCP tool catalog, or the cells-don't-execute-via-MCP gap (marimo MCP is read-only)"
osm-tools-layer-skill:
    skill:
        name: osm-tools-layer
        family: versa
        owner: charly-versa
        triggers:
            - "the OSM data pipeline tooling (tippecanoe, gdal/ogr2ogr, martin on port 3000, the pmtiles CLI), martin reading tiles from /workspace/tiles/pmtiles/, the martin data-source cache restart pattern, or vector-tiles-only MapLibre output"
sway-browser-ecovoyage-skill:
    skill:
        name: sway-browser-ecovoyage
        family: versa
        owner: charly-versa
        triggers:
            - "the versa/ecovoyage tailnet sway-browser-vnc instance — chrome-devtools-mcp + CDP debugging of the generated MapLibre and folium maps"
